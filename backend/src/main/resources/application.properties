spring.application.name=backend
server.port=${PORT:${SERVER_PORT:8080}}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/little_moments}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.default-user-id=${DEFAULT_USER_ID:00000000-0000-0000-0000-000000000001}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://*.ngrok-free.app}
app.transcription.openai-base-url=${OPENAI_BASE_URL:https://api.openai.com}
app.transcription.openai-model=${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}
app.transcription.openai-api-key=${OPENAI_API_KEY:${OPEN_AI_API_KEY:${APP_OPENAI_API_KEY:}}}
app.insights.enabled=${OPENAI_INSIGHTS_ENABLED:true}
app.insights.openai-base-url=${OPENAI_BASE_URL:https://api.openai.com}
app.insights.openai-model=${OPENAI_INSIGHTS_MODEL:gpt-4o-mini}
app.insights.openai-api-key=${OPENAI_API_KEY:${OPEN_AI_API_KEY:${APP_OPENAI_API_KEY:}}}
app.splitter.enabled=${OPENAI_SPLITTER_ENABLED:true}
app.splitter.openai-base-url=${OPENAI_BASE_URL:https://api.openai.com}
app.splitter.openai-model=${OPENAI_SPLITTER_MODEL:gpt-4o-mini}
app.splitter.openai-api-key=${OPENAI_API_KEY:${OPEN_AI_API_KEY:${APP_OPENAI_API_KEY:}}}
app.splitter.max-memories=${MEMORY_SPLITTER_MAX:5}
app.splitter.min-excerpt-chars=${MEMORY_SPLITTER_MIN_EXCERPT_CHARS:20}
app.supabase.url=${SUPABASE_URL:${VITE_SUPABASE_URL:}}
app.supabase.anon-key=${SUPABASE_ANON_KEY:${VITE_SUPABASE_ANON_KEY:}}
app.enrichment-webhook.enabled=${N8N_WEBHOOK_ENABLED:false}
app.enrichment-webhook.url=${N8N_WEBHOOK_URL:}
app.enrichment-webhook.api-key=${N8N_WEBHOOK_API_KEY:}
app.enrichment-webhook.default-language=${N8N_WEBHOOK_DEFAULT_LANGUAGE:en}
app.enrichment-webhook.timeout-ms=${N8N_WEBHOOK_TIMEOUT_MS:5000}
app.embedding-runner.enabled=${EMBEDDING_RUNNER_ENABLED:false}
app.embedding-runner.trigger-api-key=${EMBEDDING_TRIGGER_API_KEY:}
app.embedding-runner.openai-base-url=${OPENAI_BASE_URL:https://api.openai.com}
app.embedding-runner.openai-api-key=${EMBEDDING_API_KEY:${OPENAI_API_KEY:${OPEN_AI_API_KEY:${APP_OPENAI_API_KEY:}}}}
app.embedding-runner.model=${EMBEDDING_MODEL:text-embedding-3-small}
app.embedding-runner.model-version=${EMBEDDING_MODEL_VERSION:}
app.embedding-runner.dim=${EMBEDDING_DIM:1536}
app.embedding-runner.batch-size=${EMBEDDING_BATCH_SIZE:25}
app.embedding-runner.max-retries=${EMBEDDING_MAX_RETRIES:3}
app.embedding-runner.timeout-ms=${EMBEDDING_TIMEOUT_MS:30000}
app.embedding-runner.cost-per-token=${EMBEDDING_COST_PER_TOKEN:0.00000002}
app.memory-chat.enabled=${MEMORY_CHAT_ENABLED:true}
app.memory-chat.openai-base-url=${OPENAI_BASE_URL:https://api.openai.com}
app.memory-chat.openai-api-key=${MEMORY_CHAT_API_KEY:${OPENAI_API_KEY:${OPEN_AI_API_KEY:${APP_OPENAI_API_KEY:}}}}
app.memory-chat.chat-model=${MEMORY_CHAT_MODEL:gpt-4o-mini}
app.memory-chat.embedding-model=${MEMORY_CHAT_EMBEDDING_MODEL:${EMBEDDING_MODEL:text-embedding-3-small}}
app.memory-chat.retrieval-limit=${MEMORY_CHAT_RETRIEVAL_LIMIT:12}
app.memory-chat.context-limit=${MEMORY_CHAT_CONTEXT_LIMIT:8}
app.memory-chat.min-similarity=${MEMORY_CHAT_MIN_SIMILARITY:0.18}
